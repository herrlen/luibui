[project]
name = "luibui-install"
version = "0.1.0"
description = "Installiert geprüfte Pakete aus dem luibui-Register: prüft Signatur und Prüfsumme, zeigt Ampel und Rechte, richtet das Paket für Claude oder MCP ein."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["cryptography>=43"]

[project.scripts]
luibui-install = "luibui_install.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luibui_install"]
