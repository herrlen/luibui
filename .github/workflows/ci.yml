# CI: lint, type check, tests (with PostgreSQL 17) and container images.
# Actions are pinned to commit SHAs (docs/threat-model.md T42); the comment names the version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks checks the whole history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install gitleaks 8.30.1 (pinned, checksum from the official release)
        run: |
          curl -fsSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Install osv-scanner 2.6.0 (pinned, checksum from the official release)
        run: |
          curl -fsSLo /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /tmp/osv-scanner" | sha256sum -c -
          sudo install -m 755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Install opengrep 1.30.0 (pinned, checksum from the official release)
        run: |
          curl -fsSLo /tmp/opengrep https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86
          echo "35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c  /tmp/opengrep" | sha256sum -c -
          sudo install -m 755 /tmp/opengrep /usr/local/bin/opengrep
          opengrep --version
      - name: Install yr 1.21.0 (YARA-X, pinned, checksum from the official release)
        run: |
          curl -fsSLo /tmp/yr.tgz https://github.com/VirusTotal/yara-x/releases/download/v1.21.0/yara-x-v1.21.0-x86_64-unknown-linux-gnu.tar.gz
          echo "01585181e8979e36ac10ab123fcf8921cf8ba879bf942916413e091e18d64852  /tmp/yr.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/yr.tgz -C /usr/local/bin yr
          yr --version
      - name: PostgreSQL 17 client (pg_dump must match the server for the backup tests)
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Presidio in its own venv (hashes in apps/worker/presidio.txt, like the worker image)
        run: |
          python3 -m venv /opt/presidio
          /opt/presidio/bin/pip install -q --require-hashes --only-binary=:all: -r apps/worker/presidio.txt
          echo "LUIBUI_PRESIDIO_PYTHON=/opt/presidio/bin/python" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps/api apps/worker apps/ops
      - name: pytest (database tests must not be skipped in CI)
        run: |
          uv run pytest -ra -p no:cacheprovider | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "::error::tests were skipped"; exit 1; fi
      - name: Secrets in the whole history of this repository (gitleaks)
        run: gitleaks git . --redact --no-banner --exit-code 1 --gitleaks-ignore-path .gitleaksignore
      - name: Known vulnerabilities in our own dependencies (osv-scanner)
        run: |
          osv-scanner scan source --offline-vulnerabilities --download-offline-databases \
            --no-resolve --no-call-analysis=all \
            -L uv.lock -L apps/web/pnpm-lock.yaml

  web:
    name: Web (eslint, tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    name: Image ${{ matrix.service }}
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: .
            file: apps/api/Dockerfile
          - service: worker
            context: .
            file: apps/worker/Dockerfile
          - service: web
            context: apps/web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
