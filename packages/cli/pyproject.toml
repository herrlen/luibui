[project]
name = "luibui"
version = "0.1.0"
description = "luibui command line: scan, init, lint, publish, install, audit"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["luibui-scan"]

[project.scripts]
luibui = "luibui_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luibui_cli"]
