[project]
name = "luibui-scan"
version = "0.1.0"
description = "luibui scan engine: pipeline, analyzers, scoring and report for AI skills, plugins and MCP servers"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "bandit==1.9.4",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.3",
    "regex>=2026.9.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luibui_scan"]
