# Prüfkatalog C11 (M): TLS checks switched off, server open to every network (JavaScript/
# TypeScript; Python is covered by Bandit B501–B504, B104, B323).
rules:
  - id: LB-C11-unsicheres-netz-js
    languages: [javascript, typescript]
    severity: WARNING
    message: Schaltet die TLS-Prüfung ab oder öffnet einen Server für alle Netze.
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
      - pattern: $APP.listen($PORT, "0.0.0.0", ...)
