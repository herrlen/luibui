# Prüfkatalog C12 (H): a tool parameter is used as a file path without normalising it first
# (path traversal: "../../.ssh/id_rsa"). Python MCP servers (FastMCP and the official SDK).
rules:
  - id: LB-C12-pfad-ohne-grenze-py
    languages: [python]
    severity: WARNING
    message: Nutzt einen Tool-Parameter ungeprüft als Dateipfad.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.tool(...)
                  def $F(..., $P, ...):
                    ...
              - pattern-inside: |
                  @$APP.tool(...)
                  async def $F(..., $P, ...):
                    ...
              - pattern-inside: |
                  @$APP.tool
                  def $F(..., $P, ...):
                    ...
              - pattern-inside: |
                  @$APP.tool
                  async def $F(..., $P, ...):
                    ...
          - pattern: $P
    pattern-sanitizers:
      - pattern-either:
          - pattern: os.path.realpath(...)
          - pattern: os.path.abspath(...)
          - pattern: os.path.normpath(...)
          - pattern: os.path.basename(...)
          - pattern: $X.resolve(...)
          - pattern: $X.name
          - pattern: secure_filename(...)
          # A fixed file name inside the given folder: at most that one name can be reached
          # (benchmark S3-6, awslabs dynamodb: os.path.join(workspace_dir, DATA_MODEL_JSON_FILE)).
          - pattern: os.path.join($X, "...")
          - patterns:
              - pattern: os.path.join($X, $C)
              - metavariable-regex:
                  metavariable: $C
                  regex: ^[A-Z][A-Z0-9_]*$
    pattern-sinks:
      - pattern-either:
          - pattern: open($S, ...)
          # Path(x) alone reads nothing; only file operations on it do (benchmark S3-6:
          # Path(p).resolve() and Path(p).exists() were reported).
          - patterns:
              - pattern-either:
                  - pattern: Path($S, ...).$M(...)
                  - pattern: pathlib.Path($S, ...).$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(read_text|read_bytes|write_text|write_bytes|open|unlink|rmdir|iterdir|glob|rglob|touch|mkdir|rename|replace|symlink_to|chmod)$
          - pattern: os.remove($S)
          - pattern: os.unlink($S)
          - pattern: shutil.rmtree($S, ...)
          - pattern: os.listdir($S)
          - pattern: shutil.copy($S, ...)
