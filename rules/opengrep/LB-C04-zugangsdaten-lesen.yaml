# Prüfkatalog C04 (K, Sperrliste): code that touches the user's credential stores.
# Deliberately narrow: private keys and credential files only. A tool reading its own .env is
# normal and not reported here.
rules:
  - id: LB-C04-zugangsdaten-lesen-py
    languages: [python]
    severity: ERROR
    message: Greift auf gespeicherte Zugangsdaten des Nutzers zu.
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: &pfade (?i).*?((^|[/\\])(\.ssh[/\\])?id_(rsa|dsa|ecdsa|ed25519)(_sk)?$|\.ssh[/\\]id_(rsa|dsa|ecdsa|ed25519)(_sk)?\b(?!\.pub)|\.aws[/\\]credentials\b|(^|[/\\])application_default_credentials\.json$|\.config[/\\]gcloud[/\\](credentials\.db|access_tokens\.db|legacy_credentials)|(^|[/\\~])\.netrc$|(^|[/\\~])\.git-credentials$|\.docker[/\\]config\.json$|(^|[/\\~])\.pypirc$|(^|[/\\])Login Data$|(^|[/\\])key4\.db$|Library[/\\]Keychains|login\.keychain|(^|[/\\])wallet\.dat$|\.ethereum[/\\]keystore|\bsecurity\s+(find|dump)-(generic|internet)-password\b|\bsecurity\s+dump-keychain\b)
  - id: LB-C04-zugangsdaten-lesen-js
    languages: [javascript, typescript]
    severity: ERROR
    message: Greift auf gespeicherte Zugangsdaten des Nutzers zu.
    patterns:
      - pattern-either:
          - pattern: '"$S"'
          - pattern: '`$S`'
      - metavariable-regex:
          metavariable: $S
          regex: *pfade
  - id: LB-C04-zugangsdaten-lesen-sh
    languages: [bash]
    severity: ERROR
    message: Greift auf gespeicherte Zugangsdaten des Nutzers zu.
    pattern-regex: (?im)^(?!\s*#)[^\n]*((~|\$HOME|\$\{HOME\})/\.ssh/id_(rsa|dsa|ecdsa|ed25519)\b(?!\.pub)|(~|\$HOME|\$\{HOME\})/\.aws/credentials\b|(~|\$HOME|\$\{HOME\})/\.netrc\b|(~|\$HOME|\$\{HOME\})/\.git-credentials\b|(~|\$HOME|\$\{HOME\})/\.docker/config\.json\b|\bsecurity\s+(find|dump)-(generic|internet)-password\b|\bsecurity\s+dump-keychain\b|Library/Keychains)
