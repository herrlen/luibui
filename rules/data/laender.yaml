# Länderzuordnung für Ebene G (Prüfkatalog G02). Gepflegte Liste, kein Netzabruf.
#
# Stand: 2026-09-29. Quelle für Angemessenheitsbeschlüsse: Europäische Kommission,
# https://commission.europa.eu/law/law-topic/data-protection/international-dimension-data-protection/adequacy-decisions_en
# Offen, vor Veröffentlichung prüfen (Len): Brasilien (Entwurf eines Beschlusses 2025, ob
# inzwischen angenommen, ist hier nicht belegt, deshalb nicht aufgenommen).
#
# Hosts: nur Anbieter, deren Verarbeitungsort ohne Regionswahl feststeht. Anbieter mit frei
# wählbarer Region (AWS, Azure, Google Cloud Run …) stehen bewusst nicht hier.

ewr: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL,
      PT, RO, SE, SI, SK, IS, LI, NO]

angemessen:
  AD: Andorra
  AR: Argentinien
  CA: Kanada (Organisationen, die unter PIPEDA fallen)
  CH: Schweiz
  FO: Färöer
  GB: Vereinigtes Königreich
  GG: Guernsey
  IL: Israel
  IM: Isle of Man
  JE: Jersey
  JP: Japan
  KR: Republik Korea
  NZ: Neuseeland
  UY: Uruguay

# Angemessen nur für bestimmte Empfänger: Befund Mittel, bis das Manifest eine Rechtsgrundlage nennt.
teilweise:
  US: nur für Empfänger, die unter dem EU-US Data Privacy Framework zertifiziert sind

