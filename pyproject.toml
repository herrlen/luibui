[project]
name = "luibui-workspace"
version = "0.0.0"
description = "luibui monorepo workspace (not published)"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["luibui-scan", "luibui", "luibui-api", "luibui-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/engine", "packages/cli", "apps/api", "apps/worker"]

[tool.uv.sources]
luibui-scan = { workspace = true }
luibui = { workspace = true }
luibui-api = { workspace = true }
luibui-worker = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-jsonschema",
  "httpx2",
  "types-pyyaml>=6.0.12.20260906",
  "types-regex>=2026.9.10.20260911",
]

[tool.pytest.ini_options]
testpaths = ["spec/tests", "packages/engine/tests", "packages/cli/tests", "apps/api/tests", "apps/worker/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["db: needs a PostgreSQL database (DATABASE_URL)"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/design", "apps/web", "rules/opengrep"]  # rule fixtures are defused bad code on purpose

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German text uses typographic quotes and dashes

[tool.ruff.lint.isort]
known-first-party = ["luibui_scan", "luibui_cli", "luibui_api", "luibui_worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S108"]
"**/alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Test dirs share module names (conftest.py); product code is checked strictly.
exclude = ["/tests/"]

[[tool.mypy.overrides]]
# ReportLab ships no type hints (PDF report, apps/api/luibui_api/pdf.py).
module = ["reportlab.*"]
ignore_missing_imports = true
